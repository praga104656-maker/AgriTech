<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AgriTech</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="register-page">

    <!-- ================= NAVBAR ================= -->

    <header class="register-navbar">

        <a href="../index.html" class="register-logo">
            🌱 <span>AgriTech</span>
        </a>

        <a href="../index.html" class="back-home">
            ← Back to Home
        </a>

    </header>


    <!-- ================= REGISTER ================= -->

    <main class="register-container">

        <div class="register-card">

            <!-- Header -->

            <div class="register-header">

                <div class="register-icon">
                    🌱
                </div>

                <h1>Create Your Account</h1>

                <p>
                    Join AgriTech and connect directly with the agricultural marketplace
                </p>

            </div>


            <!-- Registration Form -->

            <form id="registerForm">

                <!-- Role -->

                <div class="form-group">

                    <label for="role">
                        Register as
                    </label>

                    <select id="role" name="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="FARMER">
                            👨‍🌾 Farmer
                        </option>

                        <option value="BUYER">
                            🏪 Buyer
                        </option>

                    </select>

                </div>


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter your city / district"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms -->

                <div class="terms-row">

                    <label class="terms-label">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#" class="terms-link">
                                Terms & Conditions
                            </a>
                            and
                            <a href="#" class="terms-link">
                                Privacy Policy
                            </a>
                        </span>

                    </label>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="register-submit"
                >
                    Create AgriTech Account →
                </button>

            </form>


            <!-- Login Link -->

            <div class="login-text">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login here
                </a>

            </div>


            <!-- Security -->

            <div class="register-security">

                🔒 Your information is securely protected

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="register-footer">

        <p>
            © 2026 AgriTech. Connecting farmers directly with buyers.
        </p>

    </footer>


    <script src="../js/script.js"></script>

</body>

</html>
